[project]
name = "data-collection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.15",
    "numpy>=2.5.3",
    "orjson>=3.11.9",
    "psutil>=7.0.0",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "tenacity>=9.1.2",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
